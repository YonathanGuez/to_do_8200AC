schemaVersion: 2.1.0
metadata:
  name: mydevfile
projects:
  - name: my-go-project
    clonePath: go/src/github.com/YonathanGuez/to_do_8200AC
    git:
      remotes:
        origin: "https://github.com/YonathanGuez/to_do_8200AC.git"
    tags:
      - Node.js
      - React
components:
  - name: postgres
    container:
      image: postgres:latest
      memoryLimit: 512Mi
      env:
        - name: postgres_user
          value: postgres
        - name: postgres_password
          value: postgres
        - name: postgres_db
          value: todo
      endpoints:
        - name: postgres
          targetPort: 5432
          exposure: none
  - name: image-build
    image:
      imageName: 'client:latest'
      dockerfile:
        uri: client/Dockerfile.dev
        buildContext: .
        rootRequired: false